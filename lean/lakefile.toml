name = "bayesian_security_games"
defaultTargets = ["LibraryChecks", "StochasticGames"]
testDriver = "LibraryChecks"

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "LibraryChecks"
globs = ["LibraryChecks.+"]

[[lean_lib]]
name = "StochasticGames"
globs = ["StochasticGames.+"]
