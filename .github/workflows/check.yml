name: Research map
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve existing contribution records
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            git diff --quiet --no-renames --diff-filter=MDT "$BASE" HEAD -- ':(glob)records/*.md' || {
              echo 'Append a correction record to preserve the version already cited.'
              exit 1
            }
          fi
      - name: Validate records and generated pages
        run: ruby scripts/build_map.rb --check
      - name: Replay exact witnesses
        run: |
          python3 experiments/b3_fixed_load_search.py --replay active
          python3 experiments/b3_fixed_load_search.py --replay used
          python3 experiments/b3e_parametric_replay.py
      - name: Replay market examples
        run: |
          for check in experiments/market_checks/*.py; do
            python3 "$check"
          done
      - name: Replay projected Hall cuts and deletion matchings
        run: |
          python3 -B experiments/a4h_two_port_replay.py
          python3 -B experiments/a4j_deletion_product_replay.py
          python3 -B experiments/a4j_deletion_scc_replay.py
          python3 -B experiments/a4j_any_insertion_replay.py
      - name: Replay market fixed-point transfers
        run: |
          python3 -B experiments/a4m_maxnorm_replay.py
          python3 -B experiments/a4m_lattice_replay.py
          python3 -B experiments/a4m_structure_replay.py

  stochastic-games-lean:
    name: Lean stochastic game build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          build-args: StochasticGames
          test: false
          use-mathlib-cache: true
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - name: Check proof axioms and replay the Lean binary compiler
        run: |
          (cd lean && lake env lean Replay/H4Axioms.lean)
          python3 -B experiments/h4_lean_replay.py --systematic 1

  stochastic-games-replay:
    name: Stochastic game replay with Z3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - name: Check certificates and run graph-only SMT
        run: |
          z3 --version
          python3 experiments/h4_ssg_to_mpg_replay.py --route direct --random 0 --systematic 2 --require-smt
